trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  webAppName: pythonwebapp
  serviceConnection: HDFC-Manual
  pythonVersion: 3.11

stages:
  - stage: Build
    displayName: Python Build Application
    jobs:
      - job: buildJob
        steps:

          - checkout: self
          - task: UsePythonVersion@0
            displayName: Select Python Version
            inputs:
              versionSpec: $(pythonVersion)
              addToPath: true
              architecture: 'x64'
          
          - script: |
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            displayName: Install Dependencies

          - script: |
             python -m compileall -q app.py
            displayName: Validate Python Code

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/python.zip'
              replaceExistingArchive: true


          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/python.zip'
              artifact: 'drop'
              publishLocation: 'pipeline'
          


  - stage: Deploy
    displayName: Deployment of Application 
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: deployment
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download Artifact
            inputs:
              buildType: 'current'
              artifactName: 'drop'
              targetPath: '$(Pipeline.Workspace)/drop/'
          
          - task: AzureWebApp@1
            displayName: Deploy to Azure Web App
            inputs:
              azureSubscription: $(serviceConnection)
              appType: 'webAppLinux'
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/drop/python.zip'
              runtimeStack: 'PYTHON|3.11'
              startUpCommand: 'gunicorn --bind=0.0.0.0 --timeout 600 app:app'
             
            

            
        

